<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Phuoc Luong — Programming profile</title>
  <desc id="desc">A restrained dark blue header with the name Phuoc Luong, programming languages, and a terminal-inspired detail.</desc>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#253449" stroke-width="1" opacity=".48"/>
    </pattern>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142237"/>
      <stop offset="1" stop-color="#0b1320"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="12" fill="url(#wash)"/>
  <rect width="1200" height="260" rx="12" fill="url(#grid)" opacity=".78"/>
  <path d="M0 218H1200" stroke="#33465f" stroke-width="1"/>
  <rect x="52" y="42" width="5" height="150" rx="2.5" fill="#77a8d4"/>
  <text x="82" y="64" fill="#93a9c1" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">GITHUB PROFILE</text>
  <text x="80" y="126" fill="#edf2f7" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" letter-spacing="1">PHUOC LUONG</text>
  <text x="83" y="164" fill="#b7c6d8" font-family="Arial, Helvetica, sans-serif" font-size="21">C++  /  Python  /  JavaScript</text>
  <text x="83" y="194" fill="#8498af" font-family="Arial, Helvetica, sans-serif" font-size="16">Ubuntu  ·  Arch Linux  ·  GitHub</text>

  <g transform="translate(750 48)">
    <rect width="390" height="144" rx="9" fill="#0a111c" stroke="#34465d" stroke-width="1.2"/>
    <path d="M0 34H390" stroke="#34465d"/>
    <circle cx="19" cy="17" r="4" fill="#63778e"/>
    <circle cx="34" cy="17" r="4" fill="#63778e"/>
    <circle cx="49" cy="17" r="4" fill="#63778e"/>
    <text x="70" y="21" fill="#8296ad" font-family="monospace" font-size="11">~/learning</text>
    <text x="22" y="65" fill="#83b7a3" font-family="monospace" font-size="14">$ g++ main.cpp -std=c++17</text>
    <text x="22" y="91" fill="#a7b7c9" font-family="monospace" font-size="13">$ ./a.out</text>
    <text x="22" y="119" fill="#e0e8f0" font-family="monospace" font-size="13">Program finished successfully.</text>
  </g>
  <text x="1140" y="242" fill="#6f8298" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end" letter-spacing="2">PHUOCDEVVN</text>
</svg>
